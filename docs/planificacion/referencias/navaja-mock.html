 sabe una máquina que está terminado (salida).<br><b>Qué hace:</b> el linter de la derecha analiza cada bloque mientras escribes. No se puede guardar con avisos críticos.`,forja_out:`<b>Qué ves:</b> el prompt final tal como se pega en Claude Code.<br><b>Qué hace:</b> «Copiar prompt» para la sesión interactiva; «Copiar como claude -p» para lanzarlo desde la terminal sin sesión.`,linter:`<b>Qué ves:</b> avisos del linter del método. Rojo = incumple una norma (pasos en la tarea, criterio no verificable). Ámbar = mejorable. Verde = cumple.<br><b>Qué hace:</b> calcula la puntuación del prompt: −30 por crítico, −10 por aviso.`,hist:`<b>Qué ves:</b> los prompts guardados en este proyecto.<br><b>Qué hace:</b> se exportan como <code>prompts/*.md</code>. «Editar» los carga en la forja; «Lanzado» registra un experimento; «Copiar» los pone en el portapapeles.`,cmds:`<b>Qué ves:</b> los comandos canónicos del proyecto, uno por línea.<br><b>Qué hace:</b> van a la sección «Comandos» de CLAUDE.md y alimentan las sugerencias de criterio de salida en la forja. Test y lint son obligatorios.`,hechos:`<b>Qué ves:</b> lo que el modelo no puede deducir leyendo el código: decisiones de arquitectura, restricciones legales o de dominio.<br><b>Qué hace:</b> cada línea pasa por el clasificador. PROCEDIMIENTO, ESTILO y EXPLICACIÓN se marcan para cortar; GENÉRICO solo sobrevive con ≥3 fallos en el log.`,scope:`<b>Qué ves:</b> lo que este repo no hace. Evita que el modelo construya lo que no toca.`,preview:`<b>Qué ves:</b> el CLAUDE.md exacto que se generará a partir de comandos, verificadores, hechos y fuera de alcance. El contador de arriba avisa si supera 40 líneas.`,importar:`<b>Qué ves:</b> un área para pegar el CLAUDE.md actual de un proyecto existente.<br><b>Qué hace:</b> clasifica cada línea; con «Quedarme solo con los hechos» conserva las líneas HECHO y descarta el resto. Es la ablación aplicada a un fichero real.`,verifs:`<b>Qué ves:</b> los verificadores del proyecto agrupados por tipo. Cherny: «dotar al modelo de herramientas de verificación: tests, linters, capturas».<br><b>Qué hace:</b> cada uno tiene un comando ejecutable y entra en el criterio de salida de los prompts. El E2E en navegador prueba la aplicación como un usuario final (Playwright con Firefox); el visual compara capturas píxel a píxel.`,protocolo:`<b>Qué ves:</b> los cinco pasos del protocolo de ablación en orden.<br><b>Qué hace:</b> cada botón ejecuta el paso sobre este proyecto (copiar el tag de git, vaciar hechos/skills/hooks, abrir el periodo de medición).`,tresq:`<b>Qué ves:</b> el filtro que toda línea debe pasar antes de entrar en CLAUDE.md. Si la respuesta a la tercera es sí, escribe el verificador y no la instrucción.`,log:`<b>Qué ves:</b> el registro de fallos reales del modelo durante la ablación. Una fila por fallo repetible.<br><b>Qué hace:</b> «+» suma una repetición; al llegar a 3 aparece «Reintroducir», que inyecta la instrucción candidata en CLAUDE.md. Es la única puerta de entrada.`,skills:`<b>Qué ves:</b> cada skill con las tres preguntas de la auditoría.<br><b>Qué hace:</b> la decisión se calcula sola: «No» en resultado idéntico o «Sí» en «el modelo lo hace sin ella» ⇒ borrar. Sin uso en 30 días ⇒ revisar.`,hooks:`<b>Qué ves:</b> hooks, MCP y conectores del proyecto.<br><b>Regla:</b> sobrevive lo que ejecuta una verificación o aporta un dato externo que el modelo no tiene. Un recordatorio de estilo no es ninguna de las dos cosas.`,rutina:`<b>Qué ves:</b> una rutina de mantenimiento: prompt de tres partes + frecuencia + interruptor.<br><b>Qué hace:</b> «Copiar comando» genera la invocación <code>claude -p</code> para programarla (cron, scheduled task). Entrega siempre un PR. Máximo 4 líneas; si crece, se divide.`,exp:`<b>Qué ves:</b> el diario de lanzamientos: cada vez que ejecutas un prompt anotas iteraciones y si el verificador pasó.<br><b>Qué hace:</b> aplica el método científico de Cherny. Si un prompt falla, la herramienta te pide mejorar el verificador antes que añadir contexto.`,wfform:`<b>Qué ves:</b> los parámetros del patrón Fan-Out & Synthesize.<br><b>Qué hace:</b> genera un script de orquestación con <code>agent()</code>, <code>parallel()</code> y <code>pipeline()</code>. Se usa cuando la tarea toca más de ~20 archivos o una conversación pierde el hilo.`,wfout:`<b>Qué ves:</b> el script listo. Se pega en Claude Code diciendo «use a workflow». Solo el resumen final vuelve a la ventana de contexto.`,renov:`<b>Qué ves:</b> la checklist obligatoria al cambiar de generación de modelo.<br><b>Qué hace:</b> al iniciarla se reinicia el protocolo de ablación del proyecto. Al completarla, el nuevo modelo pasa a ser el actual.`,evals:`<b>Qué ves:</b> las suites de evaluación propias y la generación para la que se crearon.<br><b>Regla:</b> un eval que todos los modelos pasan al 100 % ya no discrimina nada: se retira y se crea uno más difícil.`,arranque:`<b>Qué ves:</b> la secuencia exacta para abrir este proyecto en Claude Code con el método aplicado.<br><b>Qué hace:</b> cada paso trae el comando con los datos del proyecto (ruta, comandos, prompt). Copia y ejecuta en orden.`,verfunc:`<b>Qué ves:</b> cómo comprobar con tus propios ojos que la aplicación funciona, además de los tests: arrancarla, abrirla en el navegador y dejar que Claude la pruebe como un usuario.`,export:`<b>Qué ves:</b> los ficheros que van al repositorio, generados desde el estado de este proyecto.<br><b>Qué hace:</b> pestañas por fichero; «Copiar todo» concatena el paquete completo.`,proy:`<b>Qué ves:</b> la cartera de proyectos con su índice.<br><b>Qué hace:</b> un proyecto nuevo nace vacío (solo comandos). El asistente de prompt también puede crearlos.`,plan:`<b>Qué ves:</b> el calendario de implantación del manual: día 1, semana 1, semanas 2–4.`,wiz:`<b>Qué ves:</b> el asistente que convierte una idea en las tres partes del prompt, más el CLAUDE.md y las herramientas necesarias.<br><b>Qué hace:</b> en cada fase propone un borrador y te hace las pregu :`Import an existing CLAUDE.md`,"Quedarme solo con los hechos":`Keep only the facts`,"Vacío — así empieza toda ablación.":`Empty — that is how every ablation starts.`,"CLAUDE.md a importar":`CLAUDE.md to import`,HECHO:`FACT`,PROCEDIMIENTO:`PROCEDURE`,ESTILO:`STYLE`,EXPLICACIÓN:`EXPLANATION`,GENÉRICO:`GENERIC`,"Normas 6 y 7 · verificar antes de lanzar":`Rules 6 and 7 · verify before launching`,"Niveles de verificación":`Verification levels`,"Probar como usuario final":`Test as an end user`,"Invariantes de negocio":`Business invariants`,"Fallar, no avisar":`Fail, not warn`,"Unitarios / integración":`Unit / integration`,"Lint / análisis estático":`Lint / static analysis`,"E2E en navegador (usuario final)":`Browser E2E (end user)`,"Comparación visual":`Visual comparison`,"Contrato externo":`External contract`,Rendimiento:`Performance`,"Invariantes de negocio en un comando.":`Business invariants in one command.`,"Configurado para fallar, no para avisar.":`Set up to fail, not to warn.`,"Claude abre Firefox/Chromium y usa la app como una persona: navega, paga, ve el resultado.":`Claude opens Firefox/Chromium and uses the app like a person: navigates, pays, sees the result.`,"Captura de pantalla contra referencia, píxel a píxel (como la migración Electron→Swift).":`Screenshot against a reference, pixel by pixel (like the Electron→Swift migration).`,"Diff de OpenAPI/gRPC, fixtures de salida, compatibilidad de datos.":`OpenAPI/gRPC diff, output fixtures, data compatibility.`,"Benchmark con umbral numérico.":`Benchmark with a numeric threshold.`,"Arrancar la aplicación":`Start the application`,"Escenario en lenguaje de usuario":`Scenario in user language`,"Playwright con Firefox lo ejecuta":`Playwright with Firefox runs it`,"Captura de referencia":`Reference screenshot`,"Entra en el criterio de salida":`It goes into the exit criterion`,"Criterio de salida compuesto:":`Composite exit criterion:`,"Solo unitarios y lint. Añade el E2E en navegador para probar como usuario.":`Only tible, regístralo aquí antes de tocar CLAUDE.md.":`No failures logged. When the model fails repeatably, log it here before touching CLAUDE.md.`,"Normas 4 y 5 · repetibilidad sí, rendimiento no":`Rules 4 and 5 · repeatability yes, performance no`,"Una skill vive solo si su fin es un resultado idéntico cada vez. Un hook o conector, solo si verifica algo o aporta un dato externo. Lo demás se borra, no se archiva.":`A skill survives only if its purpose is an identical result every time. A hook or connector, only if it verifies something or brings in external data. Everything else is deleted, not archived.`,"Auditoría de skills":`Skills audit`,"¿Resultado idéntico cada vez?":`Identical result every time?`,"¿Usada en 30 días?":`Used in the last 30 days?`,"¿El modelo lo hace igual sin ella?":`Does the model do it just as well without it?`,"¿Verifica o aporta dato externo?":`Does it verify or bring in external data?`,"Hooks, MCP y conectores":`Hooks, MCP and connectors`,"Sin skills. Es el estado inicial correcto tras una ablación.":`No skills. That is the right starting state after an ablation.`,"Sin hooks ni conectores registrados.":`No hooks or connectors registered.`,"Facturas, propuestas, release notes, changelog, ADR, formatos de marca.":`Invoices, proposals, release notes, changelog, ADR, brand formats.`,"Diseñar, refactorizar, depurar, migrar, elegir arquitectura.":`Designing, refactoring, debugging, migrating, choosing architecture.`,"«No» en la primera columna o «Sí» en la tercera ⇒ borrar.":`“No” in the first column or “Yes” in the third ⇒ delete.`,"Norma 8 · el repo se mantiene solo":`Rule 8 · the repo maintains itself`,"Cada rutina es un prompt de tres partes que entrega un PR. Nunca escribe en main. Si falla dos veces seguidas, se revisa el verificador, no el prompt.":`Each routine is a three-part prompt that delivers a PR. It never writes to main. If it fails twice in a row, review the verifier, not the prompt.`,"divide en dos rutinas":`split into two routines`,"Norma 7 · programación empírica":`Rule 7 · empirical programming`,"Diario de lanzamientos":`Launch log`,Diagnóstico:`Diagnosis`,"¿Verificador en verde?":`Verifier green?`,"iteraciones medias hasta verde":`average iterations to green`,"Si sube entre generaciones de modelo, algo en el contexto estorba: ablación.":`If it rises between model generations, something in the context is in the way: ablation.`,"Todos los lanzamientos en verde. La hipótesis se sostiene: el modelo lo hace solo.":`Every launch green. The hypothesis holds: the model does it on its own.`,"Sin lanzamientos. Desde el historial de la forja, «Lanzado» crea una fila aquí.":`No launches. From the forge history, “Launched” creates a row here.`,"qué detectó el verificador":`what the verifier caught`,"¿qué no cubría el verificador?":`what did the verifier not cover?`,"Norma 9 · más de ~20 archivos o goal drift":`Rule 9 · more than ~20 files or goal drift`,Parámetros:`Parameters`,Script:`Script`,"Fase Maker-Checker: verificador independiente por fragmento":`Maker-Checker phase: an independent verifier per chunk`,"worktree (rama temporal por agente)":`worktree (temporary branch per agent)`,"read-only (solo análisis)":`read-only (analysis only)`,Aislamiento:`Isolation`,"La siguiente fase necesita todos los resultados. Barrera síncrona.":`The next phase needs every result. Synchronous barrier.`,"Cada elemento es independiente: refactorizar → probar en streaming.":`Each item is independent: refactor → test, streaming.`,Concurrencia:`Concurrency`,"≈16 agentes simultáneos; el resto se encola solo.":`≈16 agents at a time; the rest queue automatically.`,"Lanzar en Claude Code con «use a workflow» pegando el script.":`Run it in Claude Code with “use a workflow”, pasting the script.`,"Norma 10 · cada generación dispara la ablación":`Rule 10 · every generation triggers the ablation`,"Renovación completa.":`Renewal complete.`,"Sin renovación en curso":`No renewal under way`,"Sin evals registrados.":`No evals registered.`,"¿Saturado?":`Saturated?`,"Cómo abrir este proyecto en Claude Code con el método aplicado y cómo verlo funcionar con tus propios ojos.":`How to open this project in Claude Code with the method applied, and how to see it working with your own eyes.`,"Abrir el proyecto":`Open the project`,"Verlo en funcionamiento":`See it running`,"Programar las rutinas activas":`Schedule the active routines`,"Instalar Claude Code (una vez)":`Install Claude Code (once)`,"Entrar en el proyecto":`Enter the project`,"Colocar el CLAUDE.md generado en la raíz":`Put the generated CLAUDE.md in the root`,"Comprobar que los verificadores pasan ANTES de lanzar nada":`Check that the verifiers pass BEFORE launching anything`,"Abrir la sesión y pegar el prompt":`Open the session and paste the prompt`,"…o lanzarlo desatendido desde la terminal":`…or launch it unattended from the terminal`,"Abrirla en el navegador":`Open it in the browser`,"Dejar que Claude la pruebe como usuario (Firefox)":`Let Claude test it as a user (Firefox)`,"Pedir a Claude una pasada visual en sesión":`Ask Claude for a visual pass in session`,"Ver el progreso de un workflow":`Watch a workflow’s progress`,"No hay rutinas activas. Actívalas en Rutinas.":`No active routines. Turn them on in Routines.`,Salida:`Output`,Ficheros:`Files`,Cartera:`Portfolio`,"Los ficheros tal como van al repo. Cópialos, descarga el paquete, o guarda/restaura una copia de seguridad de toda la herramienta.":`The files exactly as they go into the repo. Copy them, download the package, or save/restore a backup of the whole tool.`,"Cada proyecto lleva su propio CLAUDE.md, verificadores, log, skills y rutinas. Un proyecto nuevo nace vacío: solo comandos.":`Each project carries its own CLAUDE.md, verifiers, log, skills and routines. A new project starts empty: commands only.`,"Plan de implantación":`Rollout plan`,"Verificadores test, lint y E2E en un comando. Etiquetar y vaciar. CLAUDE.md mínimo. Abrir el log.":`Test, lint and E2E verifiers in one command each. Tag and empty. Minimal CLAUDE.md. Open the log.`,"Toda tarea con tres partes. Registrar fallos y lanzamientos, no reintroducir. Activar rutina de dead code.":`Every task in three parts. Log failures and launches, reintroduce nothing. Turn on the dead-code routine.`,"Reintroducir con ≥3 fallos. Resto de rutinas. Primer workflow sobre una tarea real.":`Reintroduce with ≥3 failures. The remaining routines. First workflow on a real task.`,"Los datos se guardan en este navegador. Haz un backup JSON desde Exportar.":`Data is stored in this browser. Make a JSON backup from Export.`,"Asistente · de la idea al prompt":`Assistant · from idea to prompt`,"Siete fases guiadas. En cada una se propone un borrador y se hacen las preguntas del método; tú confirmas. Nada de pasos, todo verificable.":`Seven guided phases. Each proposes a draft and asks the method’s questions; you confirm. No steps, everything verifiable.`,Idea:`Idea`,Contexto:`Context`,Herramientas:`Tools`,Resultado:`Result`,"Cómo funciona":`How it works`,"Prompt en construcción":`Prompt under construction`,"¿Qué quieres conseguir?":`What do you want to achieve?`,"Escríbelo como resultado, con tus palabras. El asistente lo convertirá en las tres partes y te preguntará lo que falte.":`Write it as an outcome, in your own words. The assistant turns it into the three parts and asks for what is missing.`,"Stack y dominio":`Stack and domain`,"palabras clave":`keywords`,"Sirve para proponer límites, verificadores y herramientas adecuados.":`Used to propose suitable limits, verifiers and tools.`,"Escribes la idea.":`You write the idea.`,"Se propone la tarea como resultado (nunca pasos).":`The task is proposed as an outcome (never steps).`,"Eliges los límites: qué no puede tocar.":`You pick the limits: what it must not touch.`,"Eliges cómo se verifica: tests, lint y prueba como usuario en navegador.":`You pick how it is verified: tests, lint and a browser test as a user.`,"Se propone el CLAUDE.md mínimo.":`A minimal CLAUDE.md is proposed.`,"Se recomiendan solo las herramientas que pasan la regla de Cherny.":`Only tools that pass Cherny’s rule are recommended.`,"Obtienes prompt, CLAUDE.md, herramientas y comando de arranque.":`You get the prompt, CLAUDE.md, tools and the start command.`,"Tarea propuesta":`Proposed task`,"edítala si no describe el resultado":`edit it if it does not describe the outcome`,"Título corto":`Short title`,"Preguntas del método":`The method’s questions`,"¿Podría otra persona leer solo esta frase y saber qué entregar? Si necesita preguntar, falta el resultado, no los pasos.":`Could someone else read this sentence alone and know what to deliver? If they need to ask, the outcome is missing, not the steps.`,"¿Describe un estado final («los agentes pagan…») y no una actividad («implementar…»)? Los estados finales se verifican; las actividades no.":`Does it describe an end state (“agents pay…”) rather than an activity (“implement…”)? End states can be verified; activities cannot.`,"¿Cada límite es una restricción («no cambies X») y no un paso («haz X antes de Y»)? Los pasos van a la papelera.":`Is every limit a restriction (“do not change X”) rather than a step (“do X before Y”)? Steps go in the bin.`,"Pregunta del método":`The method’s question`,"Otro límite propio":`Another limit of your own`,"Escenario de usuario final":`End-user scenario`,"lo que Claude hará en el navegador":`what Claude will do in the browser`,"Hechos propuestos por el dominio":`Facts proposed by the domain`,"Añadir un hecho propio":`Add a fact of your own`,"Decisión de arquitectura o restricción de dominio":`Architecture decision or domain constraint`,"CLAUDE.md propuesto":`Proposed CLAUDE.md`,"Ninguno detectado para este dominio.":`None detected for this domain.`,"Regla de Cherny para herramientas":`Cherny’s rule for tools`,"Solo para resultado idéntico: facturas, release notes, formatos de marca.":`Only for identical output: invoices, release notes, brand formats.`,"Conector / MCP":`Connector / MCP`,"Solo si verifica algo o aporta un dato que el modelo no tiene.":`Only if it verifies something or brings data the model does not have.`,Nunca:`Never`,"Recetas de cómo programar, recordatorios de estilo, explicaciones del framework.":`Recipes for how to code, style reminders, framework explanations.`,"Herramientas a preparar":`Tools to set up`,"Ninguna adicional.":`None extra.`,Arranque:`Start`,"Nada detectado. Con test, lint y E2E suele bastar.":`Nothing detected. Test, lint and E2E are usually enough.`,"no crear":`do not create`,"No custodial: las claves nunca salen del cliente.":`Non-custodial: keys never leave the client.`,"Los importes se manejan en msat como enteros; nunca float.":`Amounts are handled in msat as integers; never float.`,"Cada herramienta MCP se factura por invocación vía L402.":`Each MCP tool is billed per invocation via L402.`,"El entorno de ejecución es el contenedor; no instalar nada en el host.":`The runtime is the container; install nothing on the host.`,verificador:`verifier`,hook:`hook`,CLI:`CLI`,MCP:`MCP`,"quién · hace qué · ve qué. Ej.: «un agente sin crédito recibe 402, paga la invoice y obtiene el recurso».":`who · does what · sees what. e.g. “an agent with no credit gets a 402, pays the invoice and obtains the resource”.`,"Falta la tarea.":`The task is missing.`,'La tarea contiene pasos ("primero", "luego"…). Define el qué, nunca el cómo.':`The task contains steps ("first", "then"…). Define the what, never the how.`,"Tarea de alto nivel, sin pasos.":`High-level task, no steps.`,"Advertencia genérica en la tarea. Conviértela en un límite o en un verificador.":`Generic warning in the task. Turn it into a limit or a verifier.`,"Sin límites. Casi toda tarea real tiene al menos uno (API pública, deps, compatibilidad).":`No limits. Almost every real task has at least one (public API, deps, compatibility).`,"Los límites contienen pasos. Un límite dice qué NO tocar, no cómo hacerlo.":`The limits contain steps. A limit says what NOT to touch, not how to do it.`,"Falta el criterio de salida. Sin él no hay ejecución desatendida posible.":`The exit criterion is missing. Without it, unattended execution is impossible.`,"El criterio no es verificable por máquina. Cita un comando, un umbral o una captura comparable.":`The criterion is not machine-verifiable. Cite a command, a threshold or a comparable screenshot.`,'Verificable, pero sin comando explícito. Mejor: "`cargo test` en verde".':'Verifiable, but with no explicit command. Better: "`cargo test` green".',"Criterio verificable y ejecutable: habilita el bucle de autocorrección.":`Verifiable, executable criterion: it enables the self-correction loop.`,"Solo verificación unitaria/lint. Si el cambio es visible para un usuario, añade el E2E en navegador o la comparación de capturas.":`Unit/lint verification only. If the change is visible to a user, add the browser E2E or the screenshot comparison.`,"Sin E2E en navegador. Si el resultado lo ve un usuario, añádelo: es el verificador que más fallos reales detecta.":`No browser E2E. If a user sees the result, add it: it is the verifier that catches the most real failures.`,"No cambiar la API pública":`Do not change the public API`,"Sin dependencias nuevas sin nota explícita":`No new dependencies without an explicit note`,"Ningún secreto ni clave en el repo":`No secrets or keys in the repo`,"No tocar la configuración de CI":`Do not touch the CI configuration`,"Compatibilidad con los datos ya persistidos":`Compatibility with already-persisted data`,"Sin `unsafe` nuevo":"No new `unsafe`","Mantener la MSRV declarada":`Keep the declared MSRV`,"Sin `any` ni `@ts-ignore`":"No `any` or `@ts-ignore`","No custodial: las claves nunca salen del cliente":`Non-custodial: keys never leave the client`,"Importes en msat como enteros; nunca float":`Amounts in msat as integers; never float`,"Sin cambios visuales fuera del flujo pedido":`No visual changes outside the requested flow`,"Skill de formato fijo (factura / release notes)":`Fixed-format skill (invoice / release notes)`,"Resultado idéntico cada vez: cumple la regla de repetibilidad.":`Identical result every time: it meets the repeatability rule.`,"Playwright (Firefox) para E2E y capturas":`Playwright (Firefox) for E2E and screenshots`,"Prueba la aplicación como usuario final y compara capturas. Es verificación, no instrucción.":`Tests the app as an end user and compares screenshots. It is verification, not instruction.`,"Conector LND gRPC (estado de canales, invoices)":`LND gRPC connector (channel state, invoices)`,"Aporta un dato externo que el modelo no tiene.":`Brings in external data the model does not have.`,"CLI gh (PRs, issues, checks de CI)":`gh CLI (PRs, issues, CI checks)`,"Verificación (estado de CI) y entrega (PR).":`Verification (CI status) and delivery (PR).`,"Conector de base de datos (solo lectura)":`Database connector (read-only)`,"Dato externo: esquema real y datos de ejemplo.":`External data: the real schema and sample rows.`,"oasdiff / buf breaking (contrato)":`oasdiff / buf breaking (contract)`,"Detecta cambios rompientes automáticamente.":`Detects breaking changes automatically.`,"Skill «guía de refactor / migración»":`A “refactor / migration guide” skill`,"Busca el mejor resultado, no uno idéntico: la receta limita al modelo. No crear.":`It seeks the best result, not an identical one: the recipe constrains the model. Do not create.`,"Hook de recordatorio de estilo":`Style-reminder hook`,"Lo impone el formateador. No verifica nada. No crear.":`The formatter enforces it. It verifies nothing. Do not create.`,"Etiquetar: git tag pre-ablation-<modelo>":`Tag: git tag pre-ablation-<model>`,"Vaciar CLAUDE.md a hechos (comandos, decisiones, fuera de alcance)":`Empty CLAUDE.md down to facts (commands, decisions, out of scope)`,"Borrar skills que no produzcan resultado idéntico":`Delete skills that do not produce an identical result`,"Borrar hooks que no verifiquen nada":`Delete hooks that verify nothing`,"
